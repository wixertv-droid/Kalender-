<!DOCTYPE html>
<html lang="de">
<head>
    <script>
        if (!sessionStorage.getItem('authKey')) {
            window.location.replace('index.html');
        }
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Agenda 2050 | Datenbank</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#ff2a6d">
    <link rel="apple-touch-icon" href="icon.png">

    <link rel="stylesheet" href="style.css">
    <script src="app.js" defer></script>

    <style>
        /* --- BESSERE STRUKTUR FÜR DIE KUNDEN-LISTEN (TABLET/HANDY SAFE) --- */
        .kunden-container { padding: 15px; margin-bottom: 80px; }
        
        /* Listen-Ansicht: Flexbox mit Wrap, damit es am Handy nicht zerquetscht wird */
        .kunde-row { 
            position: relative;
            display: flex; 
            flex-wrap: wrap; 
            gap: 15px; 
            align-items: center; 
            background: rgba(10, 15, 20, 0.7); 
            border: 1px solid var(--glass-border); 
            padding: 15px; 
            padding-right: 40px; 
            border-radius: 12px; 
            margin-bottom: 12px; 
            transition: 0.2s; 
        }
        .kunde-row:hover { background: rgba(5, 217, 232, 0.05); border-color: var(--neon-cyan); }
        
        /* Karten-Ansicht: Aufgeräumt */
        .kunde-card { 
            position: relative; 
            background: rgba(10, 15, 20, 0.7); 
            border: 1px solid var(--glass-border); 
            padding: 15px; 
            padding-right: 35px; 
            border-radius: 12px; 
            margin-bottom: 15px; 
            display: flex; 
            flex-direction: column; 
            gap: 12px;
        }
        .kunde-card:hover { border-color: var(--neon-cyan); box-shadow: 0 0 15px rgba(5,217,232,0.1); }
        
        /* Avatar */
        .k-avatar { 
            width: 45px; height: 45px; 
            border-radius: 50%; 
            display: flex; justify-content: center; align-items: center; 
            font-weight: bold; font-size: 1.1rem; 
            border: 2px solid var(--neon-cyan); 
            color: var(--neon-cyan); 
            background: rgba(5,217,232,0.1); 
            text-transform: uppercase;
            flex-shrink: 0;
        }
        
        /* Info-Bereiche */
        .k-details { flex-grow: 1; min-width: 200px; display: flex; flex-direction: column; gap: 5px; }
        .k-name-wrap { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
        .k-name { font-size: 1.1rem; font-weight: 900; color: white; text-transform: uppercase; letter-spacing: 1px; }
        
        .k-kontakt-box { font-size: 0.8rem; color: #aaa; background: rgba(0,0,0,0.4); padding: 8px 12px; border-radius: 8px; border-left: 2px solid #444; line-height: 1.5; }
        .k-kontakt-line span { color: var(--neon-violet); font-weight: bold; }

        /* Stats & Badges */
        .k-stats { display: flex; flex-direction: column; gap: 8px; min-width: 200px; }
        .k-stats-row { display: flex; gap: 8px; flex-wrap: wrap; }
        
        .badge-clean { 
            font-size: 0.75rem; font-weight: bold; padding: 4px 8px; border-radius: 4px; 
            background: rgba(255,255,255,0.05); border: 1px solid #444; color: #ccc; 
            display: flex; align-items: center; gap: 4px; white-space: nowrap;
        }
        .badge-clean.gold { border-color: var(--neon-gold); color: var(--neon-gold); background: rgba(229,176,92,0.1); }
        .badge-clean.violet { border-color: var(--neon-violet); color: var(--neon-violet); background: rgba(188,0,221,0.1); }
        .badge-clean.red { border-color: var(--neon-red); color: var(--neon-red); background: rgba(255,42,109,0.1); }
        .badge-clean.cyan { border-color: var(--neon-cyan); color: var(--neon-cyan); background: rgba(5,217,232,0.1); text-decoration: none; cursor: pointer; transition: 0.2s; }
        .badge-clean.cyan:hover { background: rgba(5,217,232,0.3); }

        .star-box { font-size: 0.75rem; color: #888; display: flex; gap: 15px; background: rgba(0,0,0,0.3); padding: 6px 10px; border-radius: 6px; }
        
        .k-vorlieben { font-size: 0.85rem; color: #aaa; font-style: italic; background: rgba(255,255,255,0.02); padding: 10px; border-radius: 8px; line-height: 1.4; }

        /* Absolutes X zum Löschen */
        .btn-delete-kunde { position: absolute; top: 10px; right: 10px; background: none; border: none; color: #666; font-size: 1.2rem; cursor: pointer; padding: 5px; transition: 0.2s; z-index: 5; }
        .btn-delete-kunde:hover { color: var(--neon-red); }

        /* --- MODAL DESIGN: Die großen 1 und 2 für Bilder --- */
        .img-upload-container { display: flex; justify-content: center; gap: 30px; margin-bottom: 25px; padding-bottom: 20px; border-bottom: 1px solid #333; }
        .img-upload-box { display: flex; flex-direction: column; align-items: center; gap: 10px; width: 45%; }
        .img-circle { 
            width: 60px; height: 60px; border-radius: 50%; 
            display: flex; justify-content: center; align-items: center; 
            font-weight: bold; font-size: 1.5rem; border: 2px dashed var(--neon-cyan); 
            color: var(--neon-cyan); background: rgba(5,217,232,0.05); 
        }
        
        /* Form Sections */
        .form-section { background: rgba(255, 255, 255, 0.02); border: 1px solid #222; border-radius: 12px; padding: 15px; margin-bottom: 15px; }
        .section-title { font-size: 0.7rem; text-transform: uppercase; color: #666; letter-spacing: 1px; margin-bottom: 10px; font-weight: bold; }

        /* Desktop vs Mobile Alignment */
        @media (min-width: 768px) {
            .k-stats { align-items: flex-end; }
            .k-stats-row { justify-content: flex-end; }
        }
    </style>
</head>
<body>

    <div class="loader-container" id="app-loader">
        <div class="cyber-spinner"></div>
        <div class="loader-text">SYNCING DATABASE...</div>
    </div>

    <div class="dashboard" style="margin-bottom: 10px;">
        <div style="width: 44px;"></div>
        <div style="text-align: center;">
            <div class="titel-neon">DATENBANK</div>
            <div class="datum-anzeige" id="kundenCounter" style="border-color: var(--neon-violet); color: var(--neon-violet); box-shadow: 0 0 10px rgba(188, 0, 221, 0.2);">0 PROFILE</div>
        </div>
        <div class="btn-cyber btn-add" onclick="openKundeModal()" style="color: var(--neon-violet); border-color: var(--neon-violet);">➕</div>
    </div>

    <div style="padding: 0 15px; margin-bottom: 15px;">
        <div style="background: var(--glass-bg); border: 1px solid var(--glass-border); padding: 12px; border-radius: 12px; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between;">
            <div style="flex-grow: 1; min-width: 150px;">
                <input type="text" id="kundenSuche" class="cyber-input-full" placeholder="Suche Name / Nummer..." onkeyup="searchKunden()" style="margin:0; background: rgba(0,0,0,0.5); border-color: #444; font-size: 0.85rem; padding: 8px;">
            </div>
            <div style="display: flex; gap: 10px; align-items: center;">
                <select id="kundenSortierung" class="cyber-select" onchange="changeSort()" style="margin:0; width: 120px; font-size: 0.8rem; padding: 6px;">
                    <option value="name_asc">Sortieren: A-Z</option>
                    <option value="name_desc">Sortieren: Z-A</option>
                    <option value="neu">Neueste zuerst</option>
                </select>
                <button onclick="toggleAnsicht()" id="btnAnsicht" style="background: rgba(5, 217, 232, 0.1); border: 1px solid var(--neon-cyan); color: var(--neon-cyan); padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 0.8rem; display: flex; align-items: center; gap: 5px;">
                    📄 Liste
                </button>
            </div>
        </div>
    </div>

    <div class="kunden-container" id="kundenListe"></div>

    <nav class="bottom-nav">
        <a href="woche.html" class="nav-item">
            <div class="nav-icon" style="color: var(--neon-cyan);">🗂️</div>
            <span>Woche</span>
        </a>
        <a href="kunden.html" class="nav-item active">
            <div class="nav-icon" style="color: var(--neon-pink);">👥</div>
            <span>Kunden</span>
        </a>
        <a href="events.html" class="nav-item">
            <div class="nav-icon" style="color: #ff3300;">🔥</div>
            <span>Events</span>
        </a>
        <a href="stats.html" class="nav-item">
            <div class="nav-icon" style="color: var(--neon-gold);">💰</div>
            <span>Finance</span>
        </a>
        <a href="einstellungen.html" class="nav-item">
            <div class="nav-icon" style="color: #fff;">⚙️</div>
            <span>System</span>
        </a>
    </nav>

    <div class="modal-overlay" id="kundeModal">
        <div class="modal-content" style="max-height: 90vh; overflow-y: auto;">
            <div class="form-title" style="color: var(--neon-cyan); border-bottom-color: var(--neon-cyan); margin-bottom: 20px;">Profil Bearbeiten</div>
            
            <div class="img-upload-container">
                <div class="img-upload-box">
                    <div class="img-circle">1</div>
                    <input type="text" id="kBild1" class="cyber-input-full" placeholder="Bild URL 1" style="font-size: 0.75rem; text-align: center; padding: 6px;">
                </div>
                <div class="img-upload-box">
                    <div class="img-circle">2</div>
                    <input type="text" id="kBild2" class="cyber-input-full" placeholder="Bild URL 2" style="font-size: 0.75rem; text-align: center; padding: 6px;">
                </div>
            </div>

            <div class="form-section">
                <div class="section-title">Identität</div>
                <div style="display: flex; gap: 10px;">
                    <div class="form-group" style="flex: 2; margin-bottom: 0;">
                        <label>Name / Alias</label>
                        <input type="text" id="kName" class="cyber-input-full" placeholder="Pflichtfeld">
                    </div>
                    <div class="form-group" style="flex: 1; margin-bottom: 0;">
                        <label>Status</label>
                        <select id="kStatus" class="cyber-select">
                            <option value="none">Keiner</option>
                            <option value="kat1">VIP</option>
                            <option value="kat2">Stamm</option>
                            <option value="kat3">Neu</option>
                        </select>
                    </div>
                </div>
            </div>

            <div class="form-section">
                <div class="section-title">Kontakte</div>
                <div style="display: flex; gap: 10px; margin-bottom: 10px;">
                    <div class="form-group" style="flex: 1; margin-bottom: 0;">
                        <label>Platt. 1</label>
                        <select id="kPlattform" class="cyber-select"></select>
                    </div>
                    <div class="form-group" style="flex: 2; margin-bottom: 0;">
                        <label>Kontakt 1</label>
                        <input type="text" id="kKontakt" class="cyber-input-full" placeholder="Nummer / Name">
                    </div>
                </div>
                <div style="display: flex; gap: 10px; margin-bottom: 10px;">
                    <div class="form-group" style="flex: 1; margin-bottom: 0;">
                        <label>Platt. 2</label>
                        <select id="kPlattform2" class="cyber-select"></select>
                    </div>
                    <div class="form-group" style="flex: 2; margin-bottom: 0;">
                        <label>Kontakt 2</label>
                        <input type="text" id="kKontakt2" class="cyber-input-full" placeholder="Optional">
                    </div>
                </div>
                <div class="form-group" style="margin-bottom: 0;">
                    <label>Profil-Link (URL)</label>
                    <input type="text" id="kLink" class="cyber-input-full" placeholder="https://...">
                </div>
            </div>

            <div class="form-section">
                <div class="section-title">Konditionen & Werte</div>
                <div style="display: flex; gap: 10px; margin-bottom: 10px;">
                    <div class="form-group" style="flex: 1; margin-bottom: 0;">
                        <label>Preis (€)</label>
                        <input type="number" id="kPreis" class="cyber-input-full" placeholder="z.B. 150">
                    </div>
                    <div class="form-group" style="flex: 1; margin-bottom: 0;">
                        <label>Präferenz</label>
                        <select id="kPraef" class="cyber-select">
                            <option value="none">Unbekannt</option>
                            <option value="AO">AO (Alles ohne)</option>
                            <option value="Save">Save (Verhütung)</option>
                        </select>
                    </div>
                    <div class="form-group" style="flex: 1; margin-bottom: 0;">
                        <label>Körperbau</label>
                        <select id="kGroesse" class="cyber-select">
                            <option value="Unbekannt">Unbekannt</option>
                            <option value="Zierlich">Zierlich</option>
                            <option value="Mittel">Mittel</option>
                            <option value="Groß">Groß</option>
                            <option value="Kurvig">Kurvig</option>
                        </select>
                    </div>
                </div>
                <div style="display: flex; gap: 10px;">
                    <div class="form-group" style="flex: 1; margin-bottom: 0;">
                        <label>Vibe (1-5)</label>
                        <input type="number" id="kVibe" class="cyber-input-full" min="1" max="5" placeholder="Sterne">
                    </div>
                    <div class="form-group" style="flex: 1; margin-bottom: 0;">
                        <label>Performance (1-5)</label>
                        <input type="number" id="kPerf" class="cyber-input-full" min="1" max="5" placeholder="Sterne">
                    </div>
                </div>
            </div>

            <div class="form-section" style="margin-bottom: 25px;">
                <div class="section-title">Akte</div>
                <div class="form-group" style="margin-bottom: 10px;">
                    <label>Vorlieben / Tabus</label>
                    <textarea id="kVorlieben" class="cyber-input-full" rows="2" placeholder="Was mag er/sie?"></textarea>
                </div>
                <div class="form-group" style="margin-bottom: 0;">
                    <label>Allgemeine Notizen</label>
                    <textarea id="kNotizen" class="cyber-input-full" rows="2" placeholder="Besonderheiten..."></textarea>
                </div>
            </div>

            <button class="btn-save" onclick="saveKunde()" style="width: 100%;">PROFIL SPEICHERN ✔️</button>
            <button onclick="closeKundeModal()" style="width:100%; background:none; border:none; color:#666; margin-top:15px; cursor:pointer; text-transform:uppercase; font-size:1rem; font-weight:bold;">Abbrechen</button>
        </div>
    </div>

    <script>
        let currentKundeId = null;
        let ansicht = localStorage.getItem('kundenAnsicht') || 'liste';

        function loadDropdowns() {
            const settings = JSON.parse(localStorage.getItem('appEinstellungen')) || { plat1: 'WhatsApp', plat2: 'Instagram', plat3: 'Telegram', plat4: 'Telefon' };
            const p1 = document.getElementById('kPlattform');
            const p2 = document.getElementById('kPlattform2');
            const html = `
                <option value="none">Keine</option>
                <option value="${settings.plat1}">${settings.plat1}</option>
                <option value="${settings.plat2}">${settings.plat2}</option>
                <option value="${settings.plat3}">${settings.plat3}</option>
                <option value="${settings.plat4}">${settings.plat4}</option>
            `;
            if (p1) p1.innerHTML = html;
            if (p2) p2.innerHTML = html;
        }

        function toggleAnsicht() {
            ansicht = ansicht === 'liste' ? 'karten' : 'liste';
            localStorage.setItem('kundenAnsicht', ansicht);
            document.getElementById('btnAnsicht').innerHTML = ansicht === 'liste' ? '📄 Liste' : '🗂️ Karten';
            renderKunden();
        }

        function changeSort() { renderKunden(); }
        function searchKunden() { renderKunden(); }

        function getStarString(count) {
            let num = parseInt(count) || 0;
            if (num === 0) return "<span style='color: #444;'>★★★★★</span>";
            return "<span style='color: var(--neon-gold); text-shadow: 0 0 8px var(--neon-gold);'>" + "★".repeat(num) + "</span><span style='color: #444;'>" + "★".repeat(5 - num) + "</span>";
        }

        function renderKunden() {
            const container = document.getElementById('kundenListe');
            if(!container) return;
            
            let kunden = JSON.parse(localStorage.getItem('appKunden')) || [];
            document.getElementById('kundenCounter').innerText = `${kunden.length} PROFILE`;

            const searchStr = document.getElementById('kundenSuche').value.toLowerCase();
            if (searchStr) {
                kunden = kunden.filter(k => 
                    (k.name && k.name.toLowerCase().includes(searchStr)) || 
                    (k.kontakt && k.kontakt.toLowerCase().includes(searchStr)) ||
                    (k.kontakt2 && k.kontakt2.toLowerCase().includes(searchStr))
                );
            }

            const sortVal = document.getElementById('kundenSortierung').value;
            if (sortVal === 'name_asc') kunden.sort((a,b) => (a.name||'').localeCompare(b.name||''));
            else if (sortVal === 'name_desc') kunden.sort((a,b) => (b.name||'').localeCompare(a.name||''));
            else if (sortVal === 'neu') kunden.sort((a,b) => b.id - a.id);

            container.innerHTML = '';
            const settings = JSON.parse(localStorage.getItem('appEinstellungen')) || {};

            if (ansicht === 'liste') {
                // LISTEN ANSICHT
                container.style.display = 'block';
                
                kunden.forEach(k => {
                    const statusName = k.status && k.status !== 'none' ? (settings[k.status+"_name"] || k.status) : '';
                    const statusColor = k.status && k.status !== 'none' ? (settings[k.status+"_farbe"] || '#fff') : '';
                    const statusBadge = statusName ? `<span class="badge-clean" style="border-color:${statusColor}; color:${statusColor};">${statusName}</span>` : '';
                    
                    const initials = (k.name ? k.name.substring(0,2) : '??').toUpperCase();
                    
                    let kontakte = [];
                    if (k.kontakt && k.kontakt.trim() !== '') kontakte.push(`<span>${k.plattform !== 'none' ? k.plattform : 'Kontakt'}:</span> ${k.kontakt}`);
                    if (k.kontakt2 && k.kontakt2.trim() !== '') kontakte.push(`<span>${k.plattform2 !== 'none' ? k.plattform2 : 'Kontakt'}:</span> ${k.kontakt2}`);
                    let kontaktHtml = kontakte.length > 0 ? `<div class="k-kontakt-box"><div class="k-kontakt-line">${kontakte.join('</div><div class="k-kontakt-line">')}</div></div>` : '';

                    let badges = '';
                    if (k.preis) badges += `<span class="badge-clean gold">💰 ${k.preis}€</span>`;
                    if (k.praeferenz && k.praeferenz !== 'none') badges += `<span class="badge-clean violet">💦 ${k.praeferenz}</span>`;
                    if (k.groesse && k.groesse !== 'Unbekannt') badges += `<span class="badge-clean">📐 ${k.groesse}</span>`;
                    if (k.noshows && k.noshows > 0) badges += `<span class="badge-clean red">⚠️ ${k.noshows}x No-Show</span>`;

                    // PROFIL LINK PANZER-SUCHE
                    let displayLink = k.profilLink || k.profillink || k.link || '';
                    if (displayLink && !displayLink.startsWith('http')) displayLink = 'https://' + displayLink;
                    if (displayLink) badges += `<a href="${displayLink}" target="_blank" onclick="event.stopPropagation();" class="badge-clean cyan">🔗 Profil</a>`;

                    container.innerHTML += `
                        <div class="kunde-row" onclick="openKundeModal(${k.id})">
                            <button class="btn-delete-kunde" onclick="event.stopPropagation(); deleteKunde(${k.id})">✖</button>
                            <div class="k-avatar">${initials}</div>
                            <div class="k-details">
                                <div class="k-name-wrap"><span class="k-name">${k.name}</span> ${statusBadge}</div>
                                ${kontaktHtml}
                            </div>
                            <div class="k-stats">
                                <div class="k-stats-row">${badges}</div>
                                <div class="star-box">
                                    <span>Vibe ${getStarString(k.vibe)}</span>
                                    <span>Perf ${getStarString(k.perf)}</span>
                                </div>
                            </div>
                        </div>
                    `;
                });
            } else {
                // KARTEN ANSICHT
                container.style.display = 'grid';
                container.style.gridTemplateColumns = 'repeat(auto-fill, minmax(300px, 1fr))';
                container.style.gap = '15px';

                kunden.forEach(k => {
                    const statusName = k.status && k.status !== 'none' ? (settings[k.status+"_name"] || k.status) : '';
                    const statusColor = k.status && k.status !== 'none' ? (settings[k.status+"_farbe"] || '#fff') : '';
                    const statusBadge = statusName ? `<span class="badge-clean" style="border-color:${statusColor}; color:${statusColor};">${statusName}</span>` : '';
                    
                    const initials = (k.name ? k.name.substring(0,2) : '??').toUpperCase();
                    
                    let kontakte = [];
                    if (k.kontakt && k.kontakt.trim() !== '') kontakte.push(`<span>${k.plattform !== 'none' ? k.plattform : 'Kontakt'}:</span> ${k.kontakt}`);
                    if (k.kontakt2 && k.kontakt2.trim() !== '') kontakte.push(`<span>${k.plattform2 !== 'none' ? k.plattform2 : 'Kontakt'}:</span> ${k.kontakt2}`);
                    let kontaktHtml = kontakte.length > 0 ? `<div class="k-kontakt-box"><div class="k-kontakt-line">${kontakte.join('</div><div class="k-kontakt-line">')}</div></div>` : '';

                    let badges = '';
                    if (k.preis) badges += `<span class="badge-clean gold">💰 ${k.preis}€</span>`;
                    if (k.praeferenz && k.praeferenz !== 'none') badges += `<span class="badge-clean violet">💦 ${k.praeferenz}</span>`;
                    if (k.groesse && k.groesse !== 'Unbekannt') badges += `<span class="badge-clean">📐 ${k.groesse}</span>`;
                    if (k.noshows && k.noshows > 0) badges += `<span class="badge-clean red">⚠️ ${k.noshows}x No-Show</span>`;

                    // PROFIL LINK PANZER-SUCHE
                    let displayLink = k.profilLink || k.profillink || k.link || '';
                    if (displayLink && !displayLink.startsWith('http')) displayLink = 'https://' + displayLink;
                    if (displayLink) badges += `<a href="${displayLink}" target="_blank" onclick="event.stopPropagation();" class="badge-clean cyan">🔗 Profil</a>`;

                    let vorliebenHtml = (k.vorlieben && k.vorlieben.trim() !== '') ? `<div class="k-vorlieben">${k.vorlieben}</div>` : '';

                    container.innerHTML += `
                        <div class="kunde-card" onclick="openKundeModal(${k.id})">
                            <button class="btn-delete-kunde" onclick="event.stopPropagation(); deleteKunde(${k.id})">✖</button>
                            
                            <div class="k-name-wrap" style="margin-bottom: 5px;">
                                <div class="k-avatar" style="width:38px; height:38px; font-size:0.9rem;">${initials}</div>
                                <div style="display:flex; flex-direction:column; align-items:flex-start;">
                                    <span class="k-name" style="font-size:1.1rem; line-height: 1.1;">${k.name}</span>
                                    ${statusBadge}
                                </div>
                            </div>
                            
                            ${kontaktHtml}
                            
                            <div class="k-stats-row" style="justify-content: flex-start; margin-top: 5px;">${badges}</div>
                            
                            <div class="star-box" style="justify-content: flex-start;">
                                <span>V: ${getStarString(k.vibe)}</span>
                                <span>P: ${getStarString(k.perf)}</span>
                            </div>
                            
                            ${vorliebenHtml}
                        </div>
                    `;
                });
            }
        }

        function openKundeModal(id = null) {
            loadDropdowns();
            currentKundeId = id;

            if (id) {
                const kunden = JSON.parse(localStorage.getItem('appKunden')) || [];
                const k = kunden.find(x => x.id === id);
                if(k) {
                    document.getElementById('kName').value = k.name || '';
                    document.getElementById('kStatus').value = k.status || 'none';
                    document.getElementById('kPlattform').value = k.plattform || 'none';
                    document.getElementById('kKontakt').value = k.kontakt || '';
                    document.getElementById('kPlattform2').value = k.plattform2 || 'none';
                    document.getElementById('kKontakt2').value = k.kontakt2 || '';
                    
                    // BEIM LADEN: Prüft alle Schreibweisen!
                    document.getElementById('kLink').value = k.profilLink || k.profillink || k.link || '';
                    
                    document.getElementById('kPreis').value = k.preis || '';
                    document.getElementById('kPraef').value = k.praeferenz || 'none';
                    document.getElementById('kGroesse').value = k.groesse || 'Unbekannt';
                    document.getElementById('kVibe').value = k.vibe || '';
                    document.getElementById('kPerf').value = k.perf || '';
                    document.getElementById('kVorlieben').value = k.vorlieben || '';
                    document.getElementById('kNotizen').value = k.notizen || '';
                    document.getElementById('kBild1').value = k.bild1 || '';
                    document.getElementById('kBild2').value = k.bild2 || '';
                }
            } else {
                document.getElementById('kName').value = '';
                document.getElementById('kStatus').value = 'none';
                document.getElementById('kPlattform').value = 'none';
                document.getElementById('kKontakt').value = '';
                document.getElementById('kPlattform2').value = 'none';
                document.getElementById('kKontakt2').value = '';
                document.getElementById('kLink').value = '';
                document.getElementById('kPreis').value = '';
                document.getElementById('kPraef').value = 'none';
                document.getElementById('kGroesse').value = 'Unbekannt';
                document.getElementById('kVibe').value = '';
                document.getElementById('kPerf').value = '';
                document.getElementById('kVorlieben').value = '';
                document.getElementById('kNotizen').value = '';
                document.getElementById('kBild1').value = '';
                document.getElementById('kBild2').value = '';
            }
            document.getElementById('kundeModal').style.display = 'flex';
        }

        function closeKundeModal() { document.getElementById('kundeModal').style.display = 'none'; }

        function saveKunde() {
            const name = document.getElementById('kName').value.trim();
            if(!name) { alert("Name fehlt!"); return; }

            let kunden = JSON.parse(localStorage.getItem('appKunden')) || [];
            const linkUrl = document.getElementById('kLink').value.trim();

            const data = {
                id: currentKundeId || Date.now(),
                name: name,
                status: document.getElementById('kStatus').value,
                plattform: document.getElementById('kPlattform').value,
                kontakt: document.getElementById('kKontakt').value.trim(),
                plattform2: document.getElementById('kPlattform2').value,
                kontakt2: document.getElementById('kKontakt2').value.trim(),
                
                // BOMBENFEST: Speichert in alle Formate!
                profillink: linkUrl,
                profilLink: linkUrl,
                link: linkUrl,
                
                preis: document.getElementById('kPreis').value,
                praeferenz: document.getElementById('kPraef').value,
                groesse: document.getElementById('kGroesse').value,
                vibe: document.getElementById('kVibe').value,
                perf: document.getElementById('kPerf').value,
                vorlieben: document.getElementById('kVorlieben').value,
                notizen: document.getElementById('kNotizen').value,
                bild1: document.getElementById('kBild1').value.trim(),
                bild2: document.getElementById('kBild2').value.trim()
            };

            if (currentKundeId) {
                const idx = kunden.findIndex(k => k.id === currentKundeId);
                if (idx > -1) {
                    data.noshows = kunden[idx].noshows || 0;
                    kunden[idx] = data;
                }
            } else {
                data.noshows = 0;
                kunden.push(data);
            }

            localStorage.setItem('appKunden', JSON.stringify(kunden));
            closeKundeModal();
            renderKunden();
        }

        function deleteKunde(id) {
            if(!confirm("Kunde wirklich löschen? Alle Daten gehen verloren!")) return;
            let kunden = JSON.parse(localStorage.getItem('appKunden')) || [];
            kunden = kunden.filter(k => k.id !== id);
            localStorage.setItem('appKunden', JSON.stringify(kunden));
            renderKunden();
        }

        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('btnAnsicht').innerHTML = ansicht === 'liste' ? '📄 Liste' : '🗂️ Karten';
            renderKunden();
            setTimeout(() => {
                const loader = document.getElementById('app-loader');
                if (loader) { loader.style.opacity = '0'; setTimeout(() => loader.remove(), 500); }
            }, 600);
        });
    </script>
</body>
</html>
