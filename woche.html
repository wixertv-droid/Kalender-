<!DOCTYPE html>
<html lang="de">
<head>
    <script>
        // HÄRTESTER TÜRSTEHER DER WELT
        if (!sessionStorage.getItem('authKey')) {
            window.location.replace('index.html');
        }
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Agenda 2050 | Wochenplaner</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#ff2a6d">
    <link rel="apple-touch-icon" href="icon.png">
    
    <link rel="stylesheet" href="style.css">
    <script src="app.js" defer></script>

    <style>
        /* Suchvorschläge Dropdown (Cyber-Style) */
        #kundenVorschlaege {
            position: absolute;
            z-index: 1000;
            width: 100%;
            background: #0a0a0d;
            border: 1px solid var(--neon-cyan);
            max-height: 250px;
            overflow-y: auto;
            border-radius: 0 0 15px 15px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.9);
        }

        .vorschlag-item {
            padding: 15px;
            cursor: pointer;
            border-bottom: 1px solid #1a1a1a;
            color: var(--neon-cyan);
            transition: background 0.2s;
        }

        .vorschlag-item:hover { background: rgba(5, 217, 232, 0.1); }

        /* NEU: Wochen-Navigation Styles */
        .week-nav-bar {
            display: flex;
            justify-content: space-between;
            padding: 10px 20px 40px 20px;
            gap: 10px;
            max-width: 800px;
            margin: 0 auto;
        }
        
        .week-nav-btn {
            background: rgba(5, 217, 232, 0.05);
            border: 1px solid var(--neon-cyan);
            color: var(--neon-cyan);
            padding: 15px 10px;
            border-radius: 12px;
            font-family: monospace;
            font-weight: bold;
            font-size: 0.9rem;
            cursor: pointer;
            flex: 1;
            text-align: center;
            transition: 0.3s;
            text-transform: uppercase;
            box-shadow: inset 0 0 10px rgba(5, 217, 232, 0.05);
        }

        .week-nav-btn:hover {
            background: var(--neon-cyan);
            color: black;
            box-shadow: 0 0 20px var(--neon-cyan);
        }

        .week-nav-btn.today {
            border-color: #666;
            color: #aaa;
            background: rgba(255,255,255,0.05);
            flex: 0.6;
        }

        .week-nav-btn.today:hover {
            border-color: white;
            color: white;
            background: rgba(255,255,255,0.1);
            box-shadow: 0 0 15px rgba(255,255,255,0.3);
        }
    </style>
</head>
<body>

    <div class="loader-container" id="app-loader">
        <div class="cyber-spinner"></div>
        <div class="loader-text">SCANNING TIMELINE...</div>
    </div>

    <div class="dashboard">
        <div class="btn-cyber btn-settings" onclick="location.href='jahr.html'" title="Jahresansicht" style="color: var(--neon-cyan); border-color: var(--neon-cyan);">📅</div>
        
        <div class="header-info">
            <div class="titel-neon" id="header-monat">SYNCING...</div>
            <div id="header-countdown" class="countdown-pulsing">SYSTEM READY</div>
        </div>

        <div class="btn-cyber btn-add" onclick="openModal()" title="Neuer Termin">➕</div>
    </div>

    <div class="wochen-container">
    </div>

    <div class="week-nav-bar">
        <button class="week-nav-btn" onclick="changeWeek(-7)">⬅️ Letzte</button>
        <button class="week-nav-btn today" onclick="location.href='woche.html'">Heute</button>
        <button class="week-nav-btn" onclick="changeWeek(7)">Nächste ➡️</button>
    </div>

        <nav class="bottom-nav">
        <a href="woche.html" class="nav-item">
            <div class="nav-icon" style="color: var(--neon-cyan);">🗂️</div>
            <span>Woche</span>
        </a>
        <a href="kunden.html" class="nav-item">
            <div class="nav-icon" style="color: var(--neon-pink);">👥</div>
            <span>Kunden</span>
        </a>
        <a href="events.html" class="nav-item">
            <div class="nav-icon" style="color: #ff3300;">🔥</div>
            <span>Events</span>
        </a>
        <a href="stats.html" class="nav-item">
            <div class="nav-icon" style="color: var(--neon-gold);">💰</div>
            <span>Finance</span>
        </a>
        <a href="einstellungen.html" class="nav-item">
            <div class="nav-icon" style="color: #fff;">⚙️</div>
            <span>System</span>
        </a>
    </nav>


    <div class="modal-overlay" id="terminModal">
        <div class="modal-content" style="max-height: 90vh; overflow-y: auto;">
            <div class="form-title">System-Eintrag</div>
            
<div class="form-group" style="position: relative;">
                <label>Kunde / Bezeichnung</label>
                <input type="text" id="terminName" class="cyber-input-full" placeholder="Name tippen..." onkeyup="sucheKundeFuerTermin()" autocomplete="off">
                <div id="kundenVorschlaege" style="display: none;"></div>
            </div>

            <div class="form-group"><label>Kategorie-Typ</label><select id="terminKategorie" class="cyber-select"></select></div>
            
            <div style="display: flex; gap: 15px; flex-wrap: wrap; background: rgba(5, 217, 232, 0.05); padding: 15px; border-radius: 12px; border: 1px dashed rgba(5,217,232,0.3); margin-bottom: 15px;">
                <div class="form-group" style="flex: 1; min-width: 120px; margin-bottom: 0;">
                    <label style="color: var(--neon-gold);">Preis (€)</label>
                    <input type="number" id="terminPreis" class="cyber-input-full" placeholder="z.B. 150">
                </div>
                <div class="form-group" style="flex: 1; min-width: 120px; margin-bottom: 0;">
                    <label style="color: var(--neon-violet);">Präferenz</label>
                    <select id="terminPraeferenz" class="cyber-select">
                        <option value="none">Keine Angabe</option>
                        <option value="AO">AO (Alles ohne)</option>
                        <option value="Save">Save (Mit Schutz)</option>
                    </select>
                </div>
            </div>

            <div class="form-group"><label>Datum</label><input type="date" id="terminDatum" class="cyber-input-full"></div>

            <div style="display:flex; gap:15px;">
                <div class="form-group" style="flex:1;"><label>Startzeit</label><input type="time" id="terminStart" class="cyber-input-full"></div>
                <div class="form-group" style="flex:1;"><label>Endzeit</label><input type="time" id="terminEnde" class="cyber-input-full"></div>
            </div>

            <div class="form-group"><label>Kontakt-Plattform</label><select id="terminPlattform" class="cyber-select" onchange="toggleKontaktFeld()"></select></div>
            <div class="form-group" id="kontaktContainer" style="display: none;"><label>Nummer / Username</label><input type="text" id="terminKontakt" class="cyber-input-full"></div>
            <div class="form-group"><label>Notizen</label><textarea id="terminNotizen" class="cyber-input-full" rows="3"></textarea></div>

            <button class="btn-save" onclick="saveAppointment()">SPEICHERN</button>
            <button onclick="closeModal()" style="width:100%; background:none; border:none; color:#666; margin-top:15px; cursor:pointer; text-transform:uppercase; font-size:1.1rem; letter-spacing:2px; font-weight:bold;">Abbrechen</button>
        </div>
    </div>

    <script>
                // --- AUTO-FILL FUNKTION ---
        function sucheKundeFuerTermin() {
            const input = document.getElementById('terminName').value.toLowerCase();
            const vBox = document.getElementById('kundenVorschlaege');
            const kunden = JSON.parse(localStorage.getItem('appKunden')) || [];
            
            if (input.length < 1) { vBox.style.display = 'none'; return; }
            
            const treffer = kunden.filter(k => k.name.toLowerCase().includes(input));
            
            if (treffer.length > 0) {
                vBox.innerHTML = '';
                treffer.forEach(k => {
                    const d = document.createElement('div');
                    d.className = 'vorschlag-item';
                    d.innerHTML = `<strong>${k.name}</strong><br><small>${k.plattform || ''}</small>`;
                    d.onclick = () => {
                        document.getElementById('terminName').value = k.name;
                        document.getElementById('terminPlattform').value = k.plattform || 'none';
                        document.getElementById('terminKontakt').value = k.kontakt || '';
                        
                        // HIER WURDE DIE NOTIZ-ZEILE GELÖSCHT! (Termin-Notizen bleiben jetzt sauber)
                        
                        document.getElementById('terminPreis').value = k.preis || '';
                        document.getElementById('terminPraeferenz').value = k.praeferenz || 'none';

                        if(typeof toggleKontaktFeld === 'function') toggleKontaktFeld();
                        vBox.style.display = 'none';
                    };
                    vBox.appendChild(d);
                });
                vBox.style.display = 'block';
            } else { vBox.style.display = 'none'; }
        }


        // --- NEU: NAVIGATIONS-LOGIK (+/- 7 Tage) ---
        function changeWeek(days) {
            const urlParams = new URLSearchParams(window.location.search);
            let currentD = urlParams.get('d');
            let dObj;

            if (currentD) {
                const parts = currentD.split('-');
                dObj = new Date(parts[0], parts[1] - 1, parts[2]);
            } else {
                dObj = new Date(); 
            }

            dObj.setDate(dObj.getDate() + days);

            const year = dObj.getFullYear();
            const month = String(dObj.getMonth() + 1).padStart(2, '0');
            const day = String(dObj.getDate()).padStart(2, '0');
            
            const newDateStr = `${year}-${month}-${day}`;

            window.location.href = `woche.html?d=${newDateStr}`;
        }

        document.addEventListener('DOMContentLoaded', () => {
            const dInput = document.getElementById('terminDatum');
            const urlParams = new URLSearchParams(window.location.search);
            if(dInput) {
                if(urlParams.get('d')) {
                    dInput.value = urlParams.get('d');
                } else {
                    const heute = new Date();
                    dInput.value = new Date(heute.getTime() - (heute.getTimezoneOffset() * 60000)).toISOString().split('T')[0];
                }
            }
        });
    </script>

</body>
</html>
