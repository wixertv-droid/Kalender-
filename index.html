<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kalender – PIN Anmeldung</title>
    <link rel="stylesheet" href="login.css">
    <link rel="icon" type="image/png" href="./icon.png">
    <link rel="apple-touch-icon" href="./icon.png">
    <link rel="manifest" href="./manifest.json">
    <link rel="apple-touch-icon" href="./icon.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
</head>
<body>

    <div class="scanlines"></div>

    <div class="loader-container">
        
        <div class="ring-group">
            <div class="hud-crosshair"></div>
            <div class="ring-outer"></div>
            <div id="cyberRing" class="ring-main"></div>
            <div class="ring-inner"></div>
            
            <div class="deco-data top-left">SYS.CORE // 89.4%</div>
            <div class="deco-data bottom-right">AUTH.REQ // 0x4F</div>
        </div>

        <div class="gateway-content">
            <div id="pinBox" aria-label="PIN-Eingabe">
                <div class="pin-display">
                    <div class="pin-dot"></div><div class="pin-dot"></div><div class="pin-dot"></div><div class="pin-dot"></div>
                </div>
            </div>
            <div id="numpadBox" class="numpad">
                <button type="button" class="num-btn" onclick="addNumber('1')">1</button>
                <button type="button" class="num-btn" onclick="addNumber('2')">2</button>
                <button type="button" class="num-btn" onclick="addNumber('3')">3</button>
                <button type="button" class="num-btn" onclick="addNumber('4')">4</button>
                <button type="button" class="num-btn" onclick="addNumber('5')">5</button>
                <button type="button" class="num-btn" onclick="addNumber('6')">6</button>
                <button type="button" class="num-btn" onclick="addNumber('7')">7</button>
                <button type="button" class="num-btn" onclick="addNumber('8')">8</button>
                <button type="button" class="num-btn" onclick="addNumber('9')">9</button>
                <button type="button" class="num-btn" onclick="clearPin()">✖</button>
                <button type="button" class="num-btn" onclick="addNumber('0')">0</button>
                <button type="button" class="num-btn" onclick="backspacePin()">⌫</button>
            </div>
            <p style="text-align:center;color:#a9b6c0;font-size:12px;margin-top:10px">Vierstellige PIN · Gerät wird zusätzlich per Zertifikat geschützt</p>
        </div>

        <div class="loader-status" id="status-text">PIN EINGEBEN</div>
    </div>

    <script src="login.js"></script>
</body>
</html>
