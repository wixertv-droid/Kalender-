 <!DOCTYPE html>
<html lang="de">
<head>
    <script>if (!sessionStorage.getItem('authKey')) { window.location.replace('index.html'); }</script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Agenda 2050 | Event Core</title>
    <link rel="stylesheet" href="style.css">
    <script src="app.js" defer></script>
    <style>
        .event-card { background: rgba(20,0,0,0.4); border: 1px solid #ff3300; border-left: 4px solid #ff3300; padding: 15px; border-radius: 12px; margin-bottom: 15px; cursor: pointer; transition: 0.3s; }
        .event-card:hover { background: rgba(255,51,0,0.1); box-shadow: 0 0 20px rgba(255,51,0,0.2); }
        .wa-box { background: #0a1f10; border: 1px dashed #25D366; padding: 15px; border-radius: 10px; margin-top: 15px; font-family: monospace; white-space: pre-wrap; color: #fff; font-size: 0.85rem;}
        .attendee-row { display: flex; justify-content: space-between; align-items: center; background: rgba(255,255,255,0.05); padding: 10px; border-radius: 8px; margin-bottom: 8px; border-left: 3px solid #666;}
        .att-status-angemeldet { border-color: #aaa; }
        .att-status-bestaetigt { border-color: var(--neon-cyan); }
        .att-status-erschienen { border-color: var(--neon-green); background: rgba(57,255,20,0.05); }
        .btn-status { font-size: 0.7rem; padding: 5px 8px; background: rgba(0,0,0,0.5); border: 1px solid #666; color: #fff; border-radius: 4px; cursor: pointer; }
    </style>
</head>
<body>

    <div class="loader-container" id="app-loader">
        <div class="cyber-spinner"></div>
        <div class="loader-text">LOADING EVENT_MATRIX...</div>
    </div>

    <div class="dashboard">
        <div style="width: 44px;"></div>
        <div class="header-info">
            <div class="titel-neon" style="color: #ff3300; text-shadow: 0 0 15px #ff3300;">EVENTS</div>
            <div class="countdown-pulsing">GangBangs & Specials</div>
        </div>
        <div class="btn-cyber btn-add" onclick="openEventModal()" style="color: #ff3300; border-color: #ff3300;">➕</div>
    </div>

    <div class="kunden-container" id="eventListe" style="padding-bottom: 100px;"></div>

    <div class="modal-overlay" id="eventModal">
        <div class="modal-content" style="max-height: 90vh; overflow-y: auto;">
            <div class="form-title" style="color: #ff3300; border-bottom-color: #ff3300;">Event Setup</div>
            
            <div style="display: flex; gap: 15px; flex-wrap: wrap;">
                <div class="form-group" style="flex: 2;"><label>Event Name</label><input type="text" id="evName" class="cyber-input-full" placeholder="z.B. GangBang Deluxe"></div>
                <div class="form-group" style="flex: 1;"><label>Datum</label><input type="date" id="evDatum" class="cyber-input-full"></div>
            </div>

            <div style="display: flex; gap: 15px; flex-wrap: wrap;">
                <div class="form-group" style="flex: 1;"><label>Startzeit</label><input type="time" id="evStart" class="cyber-input-full"></div>
                <div class="form-group" style="flex: 1;"><label>Endzeit</label><input type="time" id="evEnde" class="cyber-input-full"></div>
                <div class="form-group" style="flex: 1;"><label>Farbe</label><input type="color" id="evColor" class="cyber-color" value="#ff3300"></div>
            </div>

            <div style="display: flex; gap: 15px; flex-wrap: wrap;">
                <div class="form-group" style="flex: 1;"><label>Ort / Location</label><input type="text" id="evOrt" class="cyber-input-full" placeholder="Zimmer / Hotel..."></div>
                <div class="form-group" style="flex: 1;"><label>Preis p.P. (€)</label><input type="number" id="evPreis" class="cyber-input-full" placeholder="z.B. 150"></div>
            </div>

            <div style="display: flex; gap: 15px; flex-wrap: wrap; background: rgba(255,51,0,0.05); padding: 15px; border-radius: 12px; border: 1px dashed rgba(255,51,0,0.3); margin-bottom: 15px;">
                <div class="form-group" style="flex: 1; margin-bottom:0;"><label>Präferenz</label>
                    <select id="evPraef" class="cyber-select">
                        <option value="AO">AO (Alles ohne)</option>
                        <option value="Safe">Safe</option>
                        <option value="Beides">Beides möglich</option>
                    </select>
                </div>
                <div class="form-group" style="flex: 1; margin-bottom:0;"><label>Handtücher</label>
                    <select id="evTowels" class="cyber-select">
                        <option value="Werden gestellt">Werden gestellt</option>
                        <option value="Bitte mitbringen">Bitte mitbringen</option>
                    </select>
                </div>
            </div>

            <div class="form-group"><label>Vorlieben / Programm</label><input type="text" id="evVorlieben" class="cyber-input-full" placeholder="Was passiert?"></div>
            <div class="form-group"><label>Tabus</label><input type="text" id="evTabus" class="cyber-input-full" placeholder="Was ist streng verboten?"></div>

            <div style="margin-top: 25px; border-top: 1px solid #333; padding-top: 15px;">
                <div style="display: flex; justify-content: space-between; align-items: center;">
                    <div style="color: #25D366; font-weight: bold; text-transform: uppercase;">WhatsApp Promo-Text</div>
                    <button class="btn-save" onclick="generatePromo()" style="background: #128C7E; padding: 5px 10px; font-size: 0.8rem; width: auto;">Generieren ♻️</button>
                </div>
                <div id="promoBox" class="wa-box">Klicke auf Generieren...</div>
                <button onclick="copyPromo()" style="width:100%; background:rgba(37,211,102,0.1); border:1px solid #25D366; color:#25D366; padding:8px; margin-top:5px; border-radius:6px; cursor:pointer;">Text Kopieren 📋</button>
            </div>

            <div style="margin-top: 25px; border-top: 1px solid #333; padding-top: 15px;" id="gaesteSektion">
                <div style="color: var(--neon-cyan); font-weight: bold; text-transform: uppercase; margin-bottom: 10px;">Gästeliste</div>
                
                <div style="display: flex; gap: 10px; margin-bottom: 15px;">
                    <input type="text" id="newGuestName" class="cyber-input-full" placeholder="Name / Nickname" style="flex: 2;">
                    <button class="btn-save" onclick="addGuest()" style="flex: 1; padding: 0;">Gast +</button>
                </div>
                
                <div id="gaesteListe"></div>
            </div>

            <button class="btn-save" onclick="saveEvent()" style="margin-top: 20px; background: #ff3300; color: #fff;">EVENT SPEICHERN</button>
            <div style="display:flex; justify-content: space-between; margin-top: 15px;">
                <button onclick="closeEventModal()" style="background:none; border:none; color:#666; cursor:pointer; text-transform:uppercase; font-weight:bold;">Abbrechen</button>
                <button id="btnDelete" onclick="deleteEvent()" style="background:none; border:none; color:#ff2a6d; cursor:pointer; text-transform:uppercase; font-weight:bold; display:none;">Event Löschen ✖</button>
            </div>
        </div>
    </div>

    <nav class="bottom-nav">
        <a href="woche.html" class="nav-item">
            <div class="nav-icon" style="color: var(--neon-cyan);">🗂️</div>
            <span>Woche</span>
        </a>
        <a href="kunden.html" class="nav-item">
            <div class="nav-icon" style="color: var(--neon-pink);">👥</div>
            <span>Kunden</span>
        </a>
        <a href="events.html" class="nav-item active">
            <div class="nav-icon" style="color: #ff3300;">🔥</div>
            <span>Events</span>
        </a>
        <a href="stats.html" class="nav-item">
            <div class="nav-icon" style="color: var(--neon-gold);">💰</div>
            <span>Finance</span>
        </a>
        <a href="einstellungen.html" class="nav-item">
            <div class="nav-icon" style="color: #fff;">⚙️</div>
            <span>System</span>
        </a>
    </nav>

    <script>
        let currentEditEventId = null;
        let currentGuests = [];

        function renderEvents() {
            const container = document.getElementById('eventListe');
            container.innerHTML = '';
            const events = JSON.parse(localStorage.getItem('appEvents')) || [];
            
            // Sortieren: Zukünftige zuerst
            events.sort((a, b) => new Date(a.datum) - new Date(b.datum));

            events.forEach(e => {
                const confirmed = e.guests ? e.guests.filter(g => g.status === 'bestaetigt' || g.status === 'erschienen').length : 0;
                
                container.innerHTML += `
                    <div class="event-card" style="border-left-color: ${e.color || '#ff3300'}" onclick="openEventModal(${e.id})">
                        <div style="display: flex; justify-content: space-between; align-items: flex-start;">
                            <div style="font-size: 1.2rem; font-weight: bold; color: ${e.color || '#ff3300'}">${e.name}</div>
                            <div class="stat-badge" style="border-color: #ff3300; color: #ff3300;">${confirmed} Gäste</div>
                        </div>
                        <div style="color: #aaa; font-size: 0.85rem; margin-top: 5px;">📅 ${e.datum} | ⏰ ${e.start} - ${e.ende} Uhr</div>
                        <div style="color: #888; font-size: 0.8rem; margin-top: 5px;">📍 ${e.ort || 'TBA'} | 💦 ${e.praef}</div>
                    </div>
                `;
            });
        }

        function openEventModal(id = null) {
            currentEditEventId = id;
            document.getElementById('promoBox').innerText = "Klicke auf Generieren...";
            
            if (id) {
                const events = JSON.parse(localStorage.getItem('appEvents')) || [];
                const e = events.find(x => x.id === id);
                if(e) {
                    document.getElementById('evName').value = e.name || '';
                    document.getElementById('evDatum').value = e.datum || '';
                    document.getElementById('evStart').value = e.start || '';
                    document.getElementById('evEnde').value = e.ende || '';
                    document.getElementById('evColor').value = e.color || '#ff3300';
                    document.getElementById('evOrt').value = e.ort || '';
                    document.getElementById('evPreis').value = e.preis || '';
                    document.getElementById('evPraef').value = e.praef || 'AO';
                    document.getElementById('evTowels').value = e.towels || 'Werden gestellt';
                    document.getElementById('evVorlieben').value = e.vorlieben || '';
                    document.getElementById('evTabus').value = e.tabus || '';
                    currentGuests = e.guests || [];
                    document.getElementById('btnDelete').style.display = 'block';
                    document.getElementById('gaesteSektion').style.display = 'block';
                }
            } else {
                document.getElementById('evName').value = '';
                const heute = new Date();
                document.getElementById('evDatum').value = new Date(heute.getTime() - (heute.getTimezoneOffset() * 60000)).toISOString().split('T')[0];
                document.getElementById('evStart').value = '14:00';
                document.getElementById('evEnde').value = '18:00';
                document.getElementById('evColor').value = '#ff3300';
                document.getElementById('evOrt').value = '';
                document.getElementById('evPreis').value = '';
                document.getElementById('evPraef').value = 'AO';
                document.getElementById('evTowels').value = 'Werden gestellt';
                document.getElementById('evVorlieben').value = '';
                document.getElementById('evTabus').value = '';
                currentGuests = [];
                document.getElementById('btnDelete').style.display = 'none';
                document.getElementById('gaesteSektion').style.display = 'none'; // Gäste erst nach dem Speichern
            }
            renderGuests();
            document.getElementById('eventModal').style.display = 'flex';
        }

        function closeEventModal() { document.getElementById('eventModal').style.display = 'none'; }

        function generatePromo() {
            const name = document.getElementById('evName').value || 'Heißes Event';
            const datum = document.getElementById('evDatum').value;
            const start = document.getElementById('evStart').value;
            const ende = document.getElementById('evEnde').value;
            const ort = document.getElementById('evOrt').value || 'Wird privat mitgeteilt';
            const preis = document.getElementById('evPreis').value || '?';
            const praef = document.getElementById('evPraef').value;
            const towels = document.getElementById('evTowels').value;
            const vorlieben = document.getElementById('evVorlieben').value || '-';
            const tabus = document.getElementById('evTabus').value || '-';
            
            let dateStr = "TBA";
            if (datum) {
                const dObj = new Date(datum);
                dateStr = dObj.toLocaleDateString('de-DE', { weekday: 'long', year: 'numeric', month: '2-digit', day: '2-digit' });
            }

            const text = `🔥 *EXKLUSIVES EVENT: ${name}* 🔥\n\n📅 *Wann:* ${dateStr}\n⏰ *Uhrzeit:* ${start} - ${ende} Uhr\n📍 *Wo:* ${ort}\n💸 *Beitrag:* ${preis}€ p.P.\n💦 *Typ:* ${praef}\n🚿 *Handtücher:* ${towels}\n\n✅ *Programm / Vorlieben:*\n${vorlieben}\n\n🚫 *Tabus:*\n${tabus}\n\nBegrenzte Plätze! Melde dich jetzt verbindlich an. Ich freue mich auf dich! 😈`;
            
            document.getElementById('promoBox').innerText = text;
        }

        function copyPromo() {
            const text = document.getElementById('promoBox').innerText;
            if(text === "Klicke auf Generieren...") return;
            navigator.clipboard.writeText(text).then(() => alert("✅ Promo-Text kopiert!"));
        }

        // --- GÄSTE LOGIK ---
        function renderGuests() {
            const list = document.getElementById('gaesteListe');
            list.innerHTML = '';
            
            if(currentGuests.length === 0) {
                list.innerHTML = '<div style="color:#666; font-size:0.8rem; text-align:center;">Noch keine Gäste eingetragen.</div>';
                return;
            }

            currentGuests.forEach(g => {
                let statusColor = '#aaa';
                let nextAction = '';
                if(g.status === 'angemeldet') {
                    statusColor = '#aaa';
                    nextAction = `<button class="btn-status" style="border-color: var(--neon-cyan); color: var(--neon-cyan);" onclick="changeGuestStatus('${g.id}', 'bestaetigt')">Bestätigen</button>`;
                } else if(g.status === 'bestaetigt') {
                    statusColor = 'var(--neon-cyan)';
                    nextAction = `<button class="btn-status" style="border-color: var(--neon-green); color: var(--neon-green);" onclick="changeGuestStatus('${g.id}', 'erschienen')">Erschienen!</button>`;
                } else if(g.status === 'erschienen') {
                    statusColor = 'var(--neon-green)';
                    nextAction = `<span style="color: var(--neon-green); font-size: 0.8rem; font-weight: bold;">✓ Da</span>`;
                }

                list.innerHTML += `
                    <div class="attendee-row att-status-${g.status}">
                        <div style="flex-grow: 1;">
                            <div style="color: #fff; font-weight: bold; font-size: 0.9rem;">${g.name}</div>
                            <div style="color: ${statusColor}; font-size: 0.7rem; text-transform: uppercase;">${g.status}</div>
                        </div>
                        <div style="display:flex; gap:5px; align-items:center;">
                            ${nextAction}
                            <button class="btn-status" style="color: #ff2a6d; border-color: #ff2a6d; padding: 5px;" onclick="removeGuest('${g.id}')">✖</button>
                        </div>
                    </div>
                `;
            });
        }

        function addGuest() {
            const input = document.getElementById('newGuestName');
            if(!input.value.trim()) return;
            currentGuests.push({
                id: Date.now().toString(),
                name: input.value.trim(),
                status: 'angemeldet', // angemeldet ->
