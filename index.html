<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kalender – Gerät überprüfen</title>
    <link rel="stylesheet" href="login.css">
    <link rel="icon" type="image/png" href="./icon.png">
    <link rel="apple-touch-icon" href="./icon.png">
    <link rel="manifest" href="./manifest.json">
    <link rel="apple-touch-icon" href="./icon.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
</head>
<body>

    <div class="scanlines"></div>

    <div class="loader-container">
        
        <div class="ring-group">
            <div class="hud-crosshair"></div>
            <div class="ring-outer"></div>
            <div id="cyberRing" class="ring-main"></div>
            <div class="ring-inner"></div>
            
            <div class="deco-data top-left">SYS.CORE // 89.4%</div>
            <div class="deco-data bottom-right">AUTH.REQ // 0x4F</div>
        </div>

        <div class="gateway-content">
            <div class="login-help" style="text-align:center;padding:20px;line-height:1.7">
                <strong>Gerät wird überprüft</strong>
                <p>Keine PIN und kein Passwort nötig. Der Zugriff erfolgt über das einmalig installierte Gerätezertifikat.</p>
            </div>
        </div>

        <div class="loader-status" id="status-text">VERBINDUNG WIRD GEPRÜFT...</div>
    </div>

    <script src="login.js"></script>
</body>
</html>
